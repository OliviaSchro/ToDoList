<!DOCTYPE html>
<html>
     <!-- Sidebar -->
     <aside class="sidebar" [class.open]="sidebarOpen" aria-label="Todo lists">
          <div class="sidebar-header">
               <h2>Lists</h2>
               <button class="icon-btn" type="button" (click)="toggleSidebar()">✕</button>
          </div>

          <!-- Adding new list (reactive form!!!) -->
          <form class="add-list" (submit)="$event.preventDefault(); addList()">
               <input
                    type="text"
                    placeholder="New list name…"
                    [formControl]="newListName"
                    (keyup.enter)="addList()"
                    aria-label="New list name"
               />
               <button type="button" (click)="addList()" [disabled]="newListName.invalid">Add</button>
          </form>

          <!-- Lists -->
          <ul class="list-nav">
               @for (list of lists; track list.id) {
                    <li [class.active] = "list.id === selectedListId">
                         <button class="listButton" type="button" (click) = "selectList(list.id)">
                              {{ list.name }} <span class="count">{{ list.todos.length }}</span>
                         </button>
                         <button class = "deleteButton" type="button" (click) = "deleteList(list.id)" aria-label="Delete list">🗑</button>
                    </li>
               }
          </ul>
     </aside>

     <!-- Main -->
     <div id="main" [style.marginLeft]="sidebarOpen ? '25%' : '0'">
          <header class="topbar">
               <button class="icon-btn" type="button" (click)="toggleSidebar()">☰</button>
               <h1>My Todo List</h1>
          </header>

          @if (selectedList; as list) {
               <div class="container">
                    <h2 class="list-title">{{ list.name }}</h2>

                    <!-- Add todo (reactive) -->
                    <div class="add-todo">
                         <input
                              type="text"
                              placeholder="Add a new todo…"
                              [formControl]="newTodo"
                              (keyup.enter)="addTodo()"
                              aria-label="New todo text"
                         />
                         <button type="button" (click)="addTodo()" [disabled]="newTodo.invalid">Add</button>
                    </div>

                    <!-- Todos -->
                    <div class="todo-list">
                         @for (todo of list.todos; track todo.id) {
                              <div class="todo-item" [class.completed]="todo.completed">
                                   <input
                                        type="checkbox"
                                        [checked]="todo.completed"
                                        (change)="toggleTodo(todo.id)"
                                        aria-label="Toggle completed"
                                   />
                                   <span class="todo-text">{{ todo.text }}</span>
                                   <button class="delete-btn" type="button" (click)="deleteTodo(todo.id)">Delete</button>
                              </div>
                         }
                    </div>

                    <!-- Stats -->
                    <div class="stats">
                         <p>Total: {{ list.todos.length }}</p>
                         <p>Completed: {{ getCompletedCount() }}</p>
                         <p>Remaining: {{ getRemainingCount() }}</p>
                    </div>
               </div>
          } <!--end of if statement-->
     </div>
</html>
